<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Contact Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fbf7;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        .header {
            background: linear-gradient(135deg, #0B3B2F, #1a5c48);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }
        .content {
            padding: 30px;
        }
        .message-box {
            background: #f9fbf7;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #F9C74F;
        }
        .button {
            display: inline-block;
            background: #F9C74F;
            color: #0B3B2F;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Contact Message</h2>
        </div>
        <div class="content">
            <p><strong>From:</strong> {{ name }}</p>
            <p><strong>Email:</strong> {{ email }}</p>
            <p><strong>Subject:</strong> {{ subject }}</p>
            <p><strong>Date:</strong> {{ created_at }}</p>
            
            <div class="message-box">
                <strong>Message:</strong><br>
                {{ message|linebreaks }}
            </div>
            
            <a href="{{ admin_url }}" class="button">View in Admin Panel</a>
        </div>
    </div>
</body>
</html>
