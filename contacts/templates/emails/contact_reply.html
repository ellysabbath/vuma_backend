<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Response to Your Inquiry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f9fbf7;
        }
        .header {
            background: linear-gradient(135deg, #0B3B2F, #1a5c48);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            background: white;
            padding: 30px;
        }
        .original-message {
            background: #f9fbf7;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #F9C74F;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Response from VUMA Tanzania</h2>
        </div>
        <div class="content">
            <h3>Dear {{ name }},</h3>
            
            <p>Thank you for your inquiry. Here is our response:</p>
            
            <div style="background: #e8f5e9; padding: 20px; border-radius: 10px; margin: 20px 0;">
                {{ reply|linebreaks }}
            </div>
            
            <p><strong>Your original message:</strong></p>
            <div class="original-message">
                {{ original_message|linebreaks }}
            </div>
            
            <p>If you have any further questions, please don't hesitate to contact us again.</p>
            
            <p>Best regards,<br>
            <strong>VUMA Tanzania Team</strong></p>
        </div>
    </div>
</body>
</html>
